name: Build APK (debug + release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Download OpenVoice ONNX models into assets
        run: |
          mkdir -p app/src/main/assets/models
          base="https://huggingface.co/Hinotsuba/OpenVoice-ONNX-v2/resolve/main"
          for f in tone_extract.onnx tone_color.onnx tone_config.json; do
            echo "downloading $f"
            curl -L --retry 8 --retry-delay 6 --retry-all-errors -o "app/src/main/assets/models/$f" "$base/$f"
          done
          ls -la app/src/main/assets/models
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :xposed-hook:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pocketvoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pocketvoice-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pocketvoice-xposed-hook-apk
          path: xposed-hook/build/outputs/apk/release/xposed-hook-release-unsigned.apk
          if-no-files-found: error
